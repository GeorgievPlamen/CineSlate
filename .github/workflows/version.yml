name: Version

on:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: versioning
  cancel-in-progress: false
  
jobs:
  create_version_tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        shell: bash
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"

          echo "Merged branch: $BRANCH"

          if [[ "$BRANCH" == feature/* ]]; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == bugfix/* ]]; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "No version bump for branch: $BRANCH"
            echo "type=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Get latest version tag
        id: latest
        if: steps.bump.outputs.type != 'none'
        shell: bash
        run: |
          git fetch --tags

          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

          if [[ -z "$LATEST_TAG" ]]; then
            LATEST_TAG="v0.0.0"
          fi

          echo "latest=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $LATEST_TAG"

      - name: Calculate next version
        id: version
        if: steps.bump.outputs.type != 'none'
        shell: bash
        run: |
          LATEST="${{ steps.latest.outputs.latest }}"
          VERSION="${LATEST#v}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if [[ "${{ steps.bump.outputs.type }}" == "minor" ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [[ "${{ steps.bump.outputs.type }}" == "patch" ]]; then
            PATCH=$((PATCH + 1))
          fi

          NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"

          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "Next tag: $NEXT_TAG"

      - name: Create and push tag
        if: steps.bump.outputs.type != 'none'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "$TAG" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "$TAG"